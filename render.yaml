services:
  - type: web
    name: sru-inventory-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://sru-inventory-system-vinay-2026-delta.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
